<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversion 1.4: Liter to Milliliters</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #e4e4e4;
        font-family: Arial, Helvetica, sans-serif;
      }
      #conversion-1-4-animation {
        width: min(1110px, 100vw);
        aspect-ratio: 780 / 379;
        overflow: hidden;
        background: #e4e4e4;
      }
      .conversion-stage { display: block; width: 100%; height: 100%; }
      .replay { cursor: pointer; }
      .replay:focus { outline: none; }
    </style>
  </head>
  <body>
    <main id="conversion-1-4-animation"></main>
    <script src="Conversion_1_4.js"></script>
  </body>
</html>
