name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    permissions:
      contents: read
      # The pinned action enumerates commits through the Pull Requests REST
      # API for pull_request runs. Private repositories require this explicit
      # read scope; comments and every write-capable output remain disabled.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Scan the pull-request or push commit range without PR comments
        # gitleaks-action intentionally selects the event's commit range. A
        # separate, explicitly versioned full-history scan remains a release
        # gate before staged Production; fetch-depth alone is not that proof.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan all reachable Git history with the same pinned engine
        # The action adds its exact installed binary to GITHUB_PATH. This
        # second invocation closes the wider release-history gate instead of
        # misrepresenting the event-range scan above as a full-history scan.
        run: |
          test "$(gitleaks version)" = "8.24.3"
          gitleaks detect --source . --redact --exit-code 2 --log-opts="--all"

  supply-chain:
    name: Security and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Use repository Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.16.0

      - name: Install the locked graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reject high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Verify path-level deployment closure
        run: npm run verify:deploy-closure

      - name: Generate production-only SPDX JSON SBOM
        run: npm sbom --omit=dev --sbom-format=spdx > "${RUNNER_TEMP}/help-math-2-${GITHUB_SHA}.spdx.json"

      - name: Validate the SBOM envelope
        run: >-
          node -e "const fs=require('node:fs');
          const p=process.env.RUNNER_TEMP+'/help-math-2-'+process.env.GITHUB_SHA+'.spdx.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.spdxVersion!=='SPDX-2.3'||!Array.isArray(d.packages)||d.packages.length===0)
          process.exit(1)"

      - name: Upload the production dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: help-math-2-${{ github.sha }}-spdx
          path: ${{ runner.temp }}/help-math-2-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 30
