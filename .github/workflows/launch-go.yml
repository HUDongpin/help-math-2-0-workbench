name: Launch authorization gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-go:
    name: Launch GO
    environment: help-math-production-promotion
    env:
      # This value must be provisioned outside Git from the exact signed final
      # authorization receipt. A Git-only edit cannot manufacture a GO.
      HELP_MATH_RELEASE_AUTHORIZATION_SHA256: ${{ secrets.HELP_MATH_RELEASE_AUTHORIZATION_SHA256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate with complete anchor history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Use the repository Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.16.0

      - name: Install the exact locked graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Require complete hash-bound launch authorization
        run: npm run verify:launch-go
